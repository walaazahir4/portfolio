<div class="container" style="margin-top: 100px;">
  <h2 class="mb-5 text-center fade-in">Contact Us</h2>

  <div class="row gy-4">
    <div class="col-md-5 fade-in delay-1">
      <div class="p-4 border rounded shadow-sm">
        <h4>Contact Information</h4>
        <p><strong>Phone:</strong> +20 1208571899</p>
        <p><strong>Email:</strong> walaazahir4@gmail.com</p>
        <p><strong>Address:</strong> 88Saqr-Quorish st.-Shiratoon-New Cairo</p>
        <p><strong>Working Hours:</strong> 9 AM - 5 PM</p>
        <h5 class="mt-4">Click to chat with me on WhatsApp</h5> 
        <div class="d-flex gap-3 fs-3">
          <a href="https://wa.me/201208571899" target="_blank" rel="noopener" class="text-decoration-none text-success"
            aria-label="WhatsApp">
            <i class="bi bi-whatsapp"></i>
          </a>
        </div>
      </div>
    </div>

    <div class="col-md-7 fade-in delay-2">
      <div class="p-4 border rounded shadow-sm">
        <h4>Work Request:</h4>
        <div class="row justify-content-center">
         <form (ngSubmit)="sendEmail()">

  <div class="mb-3">
    <label for="name" class="form-label">
      Your Name <span class="text-danger">*</span>
    </label>

    <input
      type="text"
      id="name"
      [(ngModel)]="name"
      name="name"
      class="form-control"
      placeholder=" name must be 4 words...."
      (blur)="onNameBlur()"
      required
    />

    <!-- رسالة الخطأ -->
    <div
      *ngIf="nameTouched && !isNameValid()"
      class="text-danger small mt-1"
    >
      * Name must be exactly 4 words (letters only)
    </div>
  </div>

  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input
      type="email"
      id="email"
      [(ngModel)]="email"
      name="email"
      class="form-control"
      placeholder="youremail@gmail.com"
      required
    />
  </div>

  <div class="mb-3">
    <label for="message" class="form-label">Your Request</label>
    <textarea
      id="message"
      [(ngModel)]="message"
      name="message"
      rows="4"
      class="form-control"
      placeholder="Your request message..."
      required
    ></textarea>
  </div>

  <button
    type="submit"
    class="btn btn-warning fw-bold px-4"
    [disabled]="!name || !email || !message || !isNameValid()"
  >
    Send
  </button>

</form>



        </div>

      </div>
    </div>
  </div>
</div>
