<div class="container mt-5">
    <section id="projects" class="container py-5">
        <div class="text-center mb-5">
            <p class="text-warning fw-semibold">Portfolio</p>
            <h2 class="fw-bold">Mini Projects</h2>
            <p class="text-muted">Some small tasks & projects I worked on</p>
        </div>

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4" *ngFor="let task of tasks">
                <div class="card h-100 shadow-sm border-0 project-card">
                    <img [src]="task.img" class="card-img-top project-img" alt="Project">
                    <div class="card-body">
                        <h5 class="card-title fw-bold">{{ task.title }}</h5>
                        <p class="card-text text-muted">
                            {{ task.desc }}
                        </p>
                    </div>
                    <div class="card-footer bg-white border-0 d-flex justify-content-between">
                        <a href="{{task.demo}}" class="btn btn-warning btn-sm fw-bold" target="_blank">Live Demo</a>
                        <a href="https://github.com/walaazahir4" class="btn btn-outline-dark btn-sm fw-bold"
                            target="_blank">Github</a>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <button class="btn btn-warning d-inline-flex align-items-center gap-2 fw-semibold px-4 py-2 shadow-sm"
        (click)="goBack()">
        <i class="bi bi-arrow-left"></i>
        Back
    </button>
</div>
